name: Run code checks

on:
  # Trigger code checks on opening or updating a pull request.
  pull_request:

  # Pushing to the master branch triggers code checks.
  push:
    branches:
      - master
    tags-ignore:
      - "**" # Ignore all tags to prevent duplicate checks when tags are pushed.

  # It should also be possible to trigger checks manually.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actions_lint_check:
    name: Actions lint check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12

  spell_check:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
      - name: Check spelling with typos
        uses: crate-ci/typos@v1

  lint_check:
    name: Lint check
    runs-on: ubuntu-latest
    steps:
      - uses: apify/actions/python-lint-check@v1.9.0
        with:
          python-version: "3.14"

  type_check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: apify/actions/python-type-check@v1.9.0
        with:
          python-version: "3.14"
